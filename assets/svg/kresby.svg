      <use href="#venecek-prvek" transform="rotate(144 32 32)"/>
      <use href="#venecek-prvek" transform="rotate(216 32 32)"/>
      <use href="#venecek-prvek" transform="rotate(288 32 32)"/>
    </g>
  </symbol>

  <!-- obálka s lístkem -->
  <symbol id="obalka" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 24 V10 H47 V24"/>
      <path d="M23 16 H41 M23 21 H35"/>
      <path d="M8 24 H56 V54 H8 Z"/>
      <path d="M8 24 L32 42 L56 24"/>
    </g>
  </symbol>

  <!-- stonek s lístky, zatočený doprava (úvod, nad fotkou) -->
  <symbol id="stonek" viewBox="0 0 260 100">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 100 C24 60 50 32 100 26 C150 20 205 26 238 46"/>
      <path d="M36 72 C22 66 17 54 21 45 C33 47 40 60 36 72"/>
      <path d="M70 36 C64 24 70 12 81 7 C86 18 82 30 70 36"/>
      <path d="M128 22 C127 10 135 3 145 3 C147 14 139 22 128 22"/>
      <path d="M170 24 C168 37 176 45 187 47 C189 36 181 26 170 24"/>
      <path d="M238 46 C230 40 231 29 240 23 C249 30 248 41 238 46 Z"/>
    </g>
  </symbol>

  <!-- stejný stonek otočený, vychází z pravého dolního rohu a zatáčí doleva (úvod, pod fotkou) -->
  <symbol id="stonek-dole" viewBox="0 0 260 100">
    <use href="#stonek" width="260" height="100" transform="rotate(180 130 50)"/>
  </symbol>

  <!-- šipka tužkou -->
  <symbol id="sipka" viewBox="0 0 60 60">
