  <!-- lístek (odrážka) -->
  <symbol id="listek" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20 C4 10 10 4 21 4 C21 15 15 20 4 20 Z"/>
      <path d="M4 20 L14 10"/>
    </g>
  </symbol>

  <!-- ikony 20 px -->
  <symbol id="ikona-telefon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.5 3.5 H9.5 L11 8 L8.8 9.6 C10 12.2 11.8 14 14.4 15.2 L16 13 L20.5 14.5 V18.5 C20.5 19.6 19.6 20.5 18.5 20.5 C10.8 20.5 3.5 13.2 3.5 5.5 C3.5 4.4 4.4 3.5 5.5 3.5 Z"/>
    </g>
  </symbol>
  <symbol id="ikona-mapa" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
