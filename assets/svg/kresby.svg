<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Linka: 1,5 px, zaoblené konce, barva z CSS (currentColor). -->

  <!-- logo -->
  <symbol id="logo" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="31" fill="var(--sand, #E6C9A8)" stroke="none"/>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 36 H46 C46 47 40 52 32 52 C24 52 18 47 18 36 Z"/>
      <path d="M46 38 C52 38 52 46 44 46"/>
      <path d="M32 36 V22 M32 30 C28 26 24 24 22 18 M32 28 C36 24 41 22 43 15"/>
      <circle cx="32" cy="19" r="2.6"/>
      <circle cx="21" cy="15.5" r="2.2"/>
      <circle cx="44" cy="12.5" r="2.2"/>
    </g>
  </symbol>

  <!-- šálek s párou -->
  <symbol id="salek" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 30 H46 C46 44 40 50 30 50 C20 50 14 44 14 30 Z"/>
      <path d="M46 33 C54 33 54 43 44 43"/>
      <path d="M9 55 H51"/>
      <path d="M23 24 C20 20 26 17 23 11"/>
      <path d="M32 24 C29 20 35 17 32 11"/>
      <path d="M41 24 C38 20 44 17 41 11"/>
    </g>
  </symbol>

  <!-- tulipán se stonkem -->
  <symbol id="tulipan" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 60 V32"/>
      <path d="M32 52 C22 50 17 43 17 35 C26 37 31 43 32 52"/>
      <path d="M32 46 C40 44 45 39 46 32 C39 34 34 38 32 46"/>
      <path d="M21 12 C21 24 25 33 32 33 C39 33 43 24 43 12 L37.5 18 L32 9 L26.5 18 Z"/>
    </g>
  </symbol>

  <!-- nůžky a větvička -->
  <symbol id="nuzky" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="35" r="5"/>
      <circle cx="9" cy="54" r="5"/>
      <path d="M13 37 L58 56"/>
      <path d="M13 52 L58 33"/>
      <path d="M22 12 C32 6 44 6 58 12"/>
      <path d="M34 8.5 C33 3 37 1.5 40 2 C41 6 39 9 34 8.5"/>
      <path d="M47 9 C48 15 52 17 55 16 C56 12 52 8.5 47 9"/>
